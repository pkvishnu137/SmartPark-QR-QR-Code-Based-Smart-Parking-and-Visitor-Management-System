<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – SmartPark QR</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="card-box">
    <h2>Create Account</h2>
    <p class="subtitle">Register as a resident to manage visitor parking.</p>

    <div id="alert" class="alert"></div>

    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="John Doe" required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Min. 6 characters" required>

    <button id="registerBtn" type="button">Create Account</button>

    <a href="login.html" class="form-link">Already have an account? Login</a>
</div>

<script src="../js/register.js"></script>
</body>
</html>
